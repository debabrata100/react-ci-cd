name: CI

on:
  push:
    branches:
      - master
      - develop
  release:
    types:
      - published

jobs:
  verify:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Print Git SHA
        run: echo $GITHUB_SHA
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci
      - name: Run npm audit
        run: |
          echo "🔍 Checking npm dependencies for vulnerabilities..."
          npm audit --audit-level=high

      - name: Run Lint
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Build Application
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist

  docker:
    if: github.event_name != 'release'
    needs: verify

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: downloaded-dist
      - name: Verify Artifact
        run: ls -R downloaded-dist
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            debabrata100/react-ci-demo:latest
            debabrata100/react-ci-demo:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: debabrata100/react-ci-demo:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
  deploy-staging:
    needs: docker

    if: github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    environment: staging

    steps:
      - name: Trigger Staging Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
      - name: Deployment Summary
        run: |
          echo "# 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  promote-image:
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Image by Git SHA
        run: |
          docker pull debabrata100/react-ci-demo:${{ github.sha }} || {
            echo "❌ Docker image for commit ${{ github.sha }} was not found."
            exit 1
          }

      - name: Tag Release Image
        run: |
          docker tag \
            debabrata100/react-ci-demo:${{ github.sha }} \
            debabrata100/react-ci-demo:${{ github.event.release.tag_name }}

      - name: Push Release Image
        run: |
          docker push debabrata100/react-ci-demo:${{ github.event.release.tag_name }}
      - name: Verify Release Image
        run: |
          docker pull debabrata100/react-ci-demo:${{ github.event.release.tag_name }}

          docker inspect \
            debabrata100/react-ci-demo:${{ github.event.release.tag_name }} \
            --format='Digest: {{index .RepoDigests 0}}'

      - name: Promotion Summary
        run: |
          echo "# 🏷 Docker Image Promotion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source Tag | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Tag | ${{ github.event.release.tag_name }} |" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: promote-image
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Trigger Production Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"
      - name: Production Deployment Summary
        run: |
          echo "# 🚀 Production Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Tag | ${{ github.event.release.tag_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY