name: Reusable Verify

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: number

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Print Git SHA
        run: echo $GITHUB_SHA
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci
      - name: Run npm audit
        run: |
          echo "🔍 Checking npm dependencies for vulnerabilities..."
          npm audit --audit-level=high

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        if: inputs.node-version == 22
        run: npm run build
      - name: Upload Build Artifact
        if: inputs.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-node-${{ inputs.node-version }}
          path: dist